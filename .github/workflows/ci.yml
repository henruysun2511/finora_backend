name: Finora Backend CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint Code
        run: npm run lint

      - name: Unit Tests & Coverage
        run: npm run test:cov

      - name: Production Build
        run: npm run build

  deploy:
    name: Deploy to android-n5 Server
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 [Deploy] Navigating to finora_backend directory..."
            cd /home/ASUS/Finora/finora_backend

            echo "📥 [Deploy] Fetching latest code from git..."
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "🐳 [Deploy] Rebuilding and restarting Backend container..."
            cd /home/ASUS/Finora
            docker compose build backend --pull
            docker compose up -d --no-deps backend

            echo "✅ [Deploy] Verifying container status..."
            docker ps -f name=finora-backend
