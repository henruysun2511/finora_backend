services:
  redis:
    image: redis:7-alpine
    container_name: finora-redis
    restart: unless-stopped
    network_mode: "host"
    command: redis-server --requirepass ${REDIS_PASSWORD:-leebindz2304}
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finora-backend
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  redis_data:
